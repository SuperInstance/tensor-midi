<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tensor-MIDI Chart Plotter Overlay</title>
  <style>
    :root {
      --bg: #0a0a15;
      --fg: #c0c0d0;
      --accent: #6080f0;
      --accent-hot: #f06080;
      --accent-cool: #60f0c0;
      --grid: rgba(96, 128, 240, 0.08);
      --border: #1a1a2e;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', monospace;
      overflow: hidden;
      user-select: none;
    }
    
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    
    #header {
      padding: 8px 16px;
      background: #12121f;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .title {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 2px;
    }
    
    #info {
      font-size: 10px;
      color: #707088;
    }
    
    #canvas-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    
    #chart-canvas {
      display: block;
      cursor: grab;
    }
    
    #chart-canvas:active { cursor: grabbing; }
    
    #sidebar {
      width: 240px;
      background: #12121f;
      border-left: 1px solid var(--border);
      padding: 8px;
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 10;
      transform: translateX(100%);
      transition: transform 0.3s;
    }
    
    #sidebar.open { transform: translateX(0); }
    
    .sidebar-header {
      font-size: 10px;
      color: var(--accent);
      letter-spacing: 1px;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid var(--border);
    }
    
    .note-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    
    .note-item {
      padding: 3px 6px;
      background: #1a1a2e;
      border-radius: 3px;
      font-size: 10px;
      display: flex;
      gap: 6px;
      align-items: center;
    }
    
    .note-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    
    #controls {
      padding: 8px 16px;
      background: #12121f;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    #time-slider {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: #2a2a40;
      border-radius: 2px;
      outline: none;
    }
    
    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
    }
    
    #time-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: none;
    }
    
    .control-btn {
      background: #1a1a2e;
      border: 1px solid var(--border);
      color: var(--fg);
      width: 30px;
      height: 24px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .control-btn:hover { background: #2a2a40; }
    .control-btn.active { background: var(--accent); color: #fff; }
    
    #position-info {
      font-size: 10px;
      color: #707088;
      min-width: 120px;
    }
    
    #toggle-sidebar {
      position: absolute;
      top: 50px;
      right: 8px;
      z-index: 11;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="header">
      <span class="title">🧭 CHART PLOTTER — TENSOR-MIDI</span>
      <span id="info">12/8 time · 96 PPQ · SWMIDI-8</span>
    </div>
    
    <div id="canvas-wrapper">
      <canvas id="chart-canvas"></canvas>
      <button id="toggle-sidebar" class="control-btn">≡</button>
      
      <div id="sidebar">
        <div class="sidebar-header"> waypoints</div>
        <div id="note-list" class="note-list"></div>
      </div>
    </div>
    
    <div id="controls">
      <button class="control-btn" id="play-btn">▶</button>
      <input type="range" id="time-slider" min="0" max="100" value="0">
      <span id="position-info">Bar 1 · Pulse 1</span>
      <button class="control-btn" id="zoom-in">+</button>
      <button class="control-btn" id="zoom-out">−</button>
    </div>
  </div>
  
  <script>
    // ═══════════════════════════════════════════════════════════
    // CHART PLOTTER OVERLAY
    // The Saxophone's spatial dimension of conversation
    // ═══════════════════════════════════════════════════════════
    
    const canvas = document.getElementById('chart-canvas');
    const ctx = canvas.getContext('2d');
    
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let playbackPos = 0;
    let isPlaying = false;
    let animFrame = null;
    
    // Waypoints: simulated conversation as a voyage
    const waypoints = [];
    const messages = [
      { text: "Hey, let's build something together", sentiment: 'bright', weight: 0.4 },
      { text: "I love that idea! What are you thinking?", sentiment: 'bright', weight: 0.6 },
      { text: "Imagine a mixer board for conversations, rendered as jazz", sentiment: 'creative', weight: 0.8 },
      { text: "That's brilliant. Each participant gets a channel.", sentiment: 'bright', weight: 0.5 },
      { text: "And the timing? The rhythm of the conversation?", sentiment: 'inquiring', weight: 0.7 },
      { text: "Mapped to a 12-pulse grid. 12/8 time. Jazz time.", sentiment: 'creative', weight: 0.6 },
      { text: "Can we see the harmony? The tension and release?", sentiment: 'inquiring', weight: 0.8 },
      { text: "Yes. Major 7ths when we're flowing.", sentiment: 'bright', weight: 0.7 },
      { text: "This error is annoying me. The build failed again.", sentiment: 'tense', weight: 0.9 },
      { text: "I see the tension. Let me fix that.", sentiment: 'neutral', weight: 0.5 },
      { text: "Beautiful. It works now. The groove is back.", sentiment: 'bright', weight: 0.8 },
      { text: "We're in the pocket. Major 7ths. Pure flow.", sentiment: 'bright', weight: 0.9 },
    ];
    
    // Generate waypoints as a voyage path
    function generateWaypoints() {
      waypoints.length = 0;
      let x = 0, y = 0, heading = 0;
      
      for (let i = 0; i < messages.length; i++) {
        const msg = messages[i];
        const speed = 30 + msg.weight * 40;
        const turnRate = msg.sentiment === 'creative' ? 0.5 :
                         msg.sentiment === 'tense' ? -0.8 :
                         msg.sentiment === 'inquiring' ? 0.3 :
                         msg.sentiment === 'bright' ? 0.1 : 0.05;
        
        heading += turnRate + (Math.random() - 0.5) * 0.3;
        x += Math.cos(heading) * speed;
        y += Math.sin(heading) * speed;
        
        waypoints.push({
          x, y, heading,
          sentiment: msg.sentiment,
          weight: msg.weight,
          text: msg.text,
          index: i,
        });
      }
    }
    
    generateWaypoints();
    
    // Colors by sentiment
    const sentimentColors = {
      bright: '#60f0c0',
      creative: '#f0c060',
      tense: '#f06080',
      neutral: '#6080f0',
      inquiring: '#c0a0f0',
    };
    
    function resize() {
      const wrapper = document.getElementById('canvas-wrapper');
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      draw();
    }
    
    window.addEventListener('resize', resize);
    
    function draw() {
      const w = canvas.width;
      const h = canvas.height;
      
      // Clear
      ctx.fillStyle = '#0a0a15';
      ctx.fillRect(0, 0, w, h);
      
      // Center origin
      ctx.save();
      ctx.translate(w / 2 + panX, h / 2 + panY);
      ctx.scale(zoom, zoom);
      
      // Draw nautical grid
      ctx.strokeStyle = 'rgba(96, 128, 240, 0.08)';
      ctx.lineWidth = 1 / zoom;
      const gridSize = 50;
      const range = Math.max(w, h) / zoom;
      for (let x = -range; x < range; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, -range);
        ctx.lineTo(x, range);
        ctx.stroke();
      }
      for (let y = -range; y < range; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(-range, y);
        ctx.lineTo(range, y);
        ctx.stroke();
      }
      
      // Draw "coastline" decoration
      ctx.strokeStyle = 'rgba(96, 240, 192, 0.15)';
      ctx.lineWidth = 2 / zoom;
      ctx.beginPath();
      for (let i = 0; i < 200; i++) {
        const angle = (i / 200) * Math.PI * 2;
        const r = 300 + Math.sin(angle * 3) * 80 + Math.cos(angle * 7) * 30;
        const px = Math.cos(angle) * r;
        const py = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.stroke();
      
      // Draw concentric range rings
      ctx.strokeStyle = 'rgba(96, 128, 240, 0.06)';
      for (let r = 50; r < range; r += 50) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      
      // Draw the trail up to playbackPos
      const visibleCount = Math.floor((playbackPos / 100) * waypoints.length) + 1;
      const visible = Math.min(visibleCount, waypoints.length);
      
      if (visible > 1) {
        // Trail line
        ctx.lineWidth = 2 / zoom;
        for (let i = 1; i < visible; i++) {
          const prev = waypoints[i - 1];
          const curr = waypoints[i];
          const alpha = 0.3 + (i / visible) * 0.7;
          ctx.strokeStyle = `rgba(96, 128, 240, ${alpha})`;
          ctx.beginPath();
          ctx.moveTo(prev.x, prev.y);
          ctx.lineTo(curr.x, curr.y);
          ctx.stroke();
        }
        
        // Waypoint markers
        for (let i = 0; i < visible; i++) {
          const wp = waypoints[i];
          const color = sentimentColors[wp.sentiment] || '#6080f0';
          const radius = 3 + wp.weight * 4;
          
          // Glow
          ctx.shadowColor = color;
          ctx.shadowBlur = 8;
          
          // Dot
          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(wp.x, wp.y, radius / zoom, 0, Math.PI * 2);
          ctx.fill();
          
          ctx.shadowBlur = 0;
          
          // Label
          ctx.fillStyle = '#c0c0d0';
          ctx.font = `${10 / zoom}px monospace`;
          ctx.fillText(`♪${i + 1}`, wp.x + radius / zoom + 2 / zoom, wp.y - 3 / zoom);
          
          // Current waypoint has a ring
          if (i === visible - 1 && visible < waypoints.length) {
            ctx.strokeStyle = color;
            ctx.lineWidth = 2 / zoom;
            ctx.beginPath();
            ctx.arc(wp.x, wp.y, (radius + 6) / zoom, 0, Math.PI * 2);
            ctx.stroke();
          }
        }
        
        // Vessel at current position
        const vessel = waypoints[visible - 1];
        ctx.save();
        ctx.translate(vessel.x, vessel.y);
        ctx.rotate(vessel.heading);
        
        // Vessel triangle
        const vSize = 12 / zoom;
        ctx.fillStyle = sentimentColors[vessel.sentiment] || '#6080f0';
        ctx.shadowColor = sentimentColors[vessel.sentiment] || '#6080f0';
        ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(vSize, 0);
        ctx.lineTo(-vSize * 0.7, vSize * 0.6);
        ctx.lineTo(-vSize * 0.4, 0);
        ctx.lineTo(-vSize * 0.7, -vSize * 0.6);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.restore();
      }
      
      ctx.restore();
      
      // Draw compass (fixed position, top-right)
      drawCompass(w - 50, 50);
      
      // Draw message overlay for current waypoint
      if (visible > 0 && visible <= waypoints.length) {
        const current = waypoints[Math.min(visible - 1, waypoints.length - 1)];
        drawMessageOverlay(current, w, h);
      }
      
      // Update position info
      const bar = Math.floor((playbackPos / 100) * 4) + 1;
      const pulse = Math.floor((playbackPos / 100) * 12) % 12 + 1;
      document.getElementById('position-info').textContent = `Bar ${bar} · Pulse ${pulse} · ${visible}/${waypoints.length}`;
    }
    
    function drawCompass(x, y) {
      ctx.save();
      ctx.translate(x, y);
      
      ctx.strokeStyle = 'rgba(96, 128, 240, 0.4)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.stroke();
      
      // N marker
      ctx.fillStyle = '#f06080';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('N', 0, -28);
      ctx.beginPath();
      ctx.moveTo(0, -20);
      ctx.lineTo(-3, -14);
      ctx.lineTo(3, -14);
      ctx.closePath();
      ctx.fill();
      
      // Other directions
      ctx.fillStyle = '#707088';
      ctx.font = '9px monospace';
      ctx.fillText('S', 0, 34);
      ctx.fillText('W', -32, 3);
      ctx.fillText('E', 32, 3);
      
      ctx.textAlign = 'left';
      ctx.restore();
    }
    
    function drawMessageOverlay(waypoint, canvasW, canvasH) {
      const text = waypoint.text;
      const maxWidth = 250;
      
      ctx.font = '11px monospace';
      
      // Wrap text
      const words = text.split(' ');
      const lines = [];
      let line = '';
      for (const word of words) {
        const test = line ? line + ' ' + word : word;
        if (ctx.measureText(test).width > maxWidth) {
          if (line) lines.push(line);
          line = word;
        } else {
          line = test;
        }
      }
      if (line) lines.push(line);
      
      const padding = 8;
      const lineHeight = 14;
      const boxHeight = lines.length * lineHeight + padding * 2;
      const boxWidth = maxWidth + padding * 2;
      
      const x = canvasW / 2 - boxWidth / 2;
      const y = canvasH - boxHeight - 60;
      
      // Background
      ctx.fillStyle = 'rgba(18, 18, 31, 0.95)';
      ctx.strokeStyle = sentimentColors[waypoint.sentiment] || '#6080f0';
      ctx.lineWidth = 1;
      
      roundRect(ctx, x, y, boxWidth, boxHeight, 6);
      ctx.fill();
      ctx.stroke();
      
      // Text
      ctx.fillStyle = '#c0c0d0';
      ctx.textAlign = 'left';
      for (let i = 0; i < lines.length; i++) {
        ctx.fillText(lines[i], x + padding, y + padding + (i + 1) * lineHeight - 3);
      }
      
      // Sentiment tag
      ctx.fillStyle = sentimentColors[waypoint.sentiment];
      ctx.font = '9px monospace';
      ctx.fillText(`♪${waypoint.index + 1} · ${waypoint.sentiment.toUpperCase()}`, x + padding, y - 6);
    }
    
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r);
      ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
      ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r);
      ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r);
      ctx.closePath();
    }
    
    // ── Interactions ──────────────────────────────────
    
    canvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX - panX, y: e.clientY - panY };
    });
    
    canvas.addEventListener('mousemove', (e) => {
      if (isDragging) {
        panX = e.clientX - dragStart.x;
        panY = e.clientY - dragStart.y;
        draw();
      }
    });
    
    canvas.addEventListener('mouseup', () => { isDragging = false; });
    canvas.addEventListener('mouseleave', () => { isDragging = false; });
    
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      zoom = Math.max(0.3, Math.min(5, zoom * delta));
      draw();
    });
    
    // Touch support
    let touchStart = null;
    let touchDist = null;
    
    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length === 1) {
        touchStart = { x: e.touches[0].clientX - panX, y: e.touches[0].clientY - panY };
      } else if (e.touches.length === 2) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        touchDist = Math.sqrt(dx * dx + dy * dy);
      }
    });
    
    canvas.addEventListener('touchmove', (e) => {
      e.preventDefault();
      if (e.touches.length === 1 && touchStart) {
        panX = e.touches[0].clientX - touchStart.x;
        panY = e.touches[0].clientY - touchStart.y;
        draw();
      } else if (e.touches.length === 2 && touchDist) {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        const newDist = Math.sqrt(dx * dx + dy * dy);
        zoom = Math.max(0.3, Math.min(5, zoom * (newDist / touchDist)));
        touchDist = newDist;
        draw();
      }
    });
    
    // Controls
    document.getElementById('play-btn').addEventListener('click', () => {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      btn.textContent = isPlaying ? '⏸' : '▶';
      btn.classList.toggle('active', isPlaying);
      if (isPlaying) animate();
    });
    
    function animate() {
      if (!isPlaying) return;
      playbackPos += 0.5;
      if (playbackPos >= 100) {
        playbackPos = 0;
      }
      document.getElementById('time-slider').value = playbackPos;
      updateNoteList();
      draw();
      animFrame = requestAnimationFrame(animate);
    }
    
    document.getElementById('time-slider').addEventListener('input', (e) => {
      playbackPos = parseFloat(e.target.value);
      updateNoteList();
      draw();
    });
    
    document.getElementById('zoom-in').addEventListener('click', () => {
      zoom = Math.min(5, zoom * 1.3);
      draw();
    });
    
    document.getElementById('zoom-out').addEventListener('click', () => {
      zoom = Math.max(0.3, zoom / 1.3);
      draw();
    });
    
    document.getElementById('toggle-sidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.toggle('open');
    });
    
    function updateNoteList() {
      const visibleCount = Math.floor((playbackPos / 100) * waypoints.length) + 1;
      const visible = Math.min(visibleCount, waypoints.length);
      
      const list = document.getElementById('note-list');
      list.innerHTML = waypoints.slice(0, visible).map((wp, i) => {
        const color = sentimentColors[wp.sentiment] || '#6080f0';
        return `
          <div class="note-item">
            <div class="note-dot" style="background:${color}"></div>
            <span>♪${i + 1} ${wp.sentiment}</span>
          </div>
        `;
      }).join('');
    }
    
    // ── Initialize ────────────────────────────────────
    resize();
    updateNoteList();
    
    // Auto-center on waypoints
    setTimeout(() => {
      // Fit all waypoints in view
      const xs = waypoints.map(w => w.x);
      const ys = waypoints.map(w => w.y);
      const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
      const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
      const w = Math.max(...xs) - Math.min(...xs) + 200;
      const h = Math.max(...ys) - Math.min(...ys) + 200;
      const scaleX = canvas.width / w;
      const scaleY = canvas.height / h;
      zoom = Math.min(scaleX, scaleY, 2);
      panX = -cx * zoom;
      panY = -cy * zoom;
      draw();
    }, 100);
    
    console.log('🧭 Chart Plotter initialized');
    console.log(`${waypoints.length} waypoints loaded`);
  </script>
</body>
</html>
