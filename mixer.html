<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TENSOR-MIDI MIXER — Conversation as Music</title>
<style>
:root {
  --bg: #0a0d14;
  --panel: #111827;
  --panel-hi: #1a2332;
  --border: #1e2d3d;
  --text: #e2e8f0;
  --text-dim: #5c6b82;
  --accent: #3b82f6;
  --ecn: #8b5cf6;
  --dmn: #ec4899;
  --flow: #06b6d4;
  --mute: #f59e0b;
  --solo: #3b82f6;
  --tension-lo: #22c55e;
  --tension-hi: #ef4444;
  --fader-track: #0f172a;
  --fader-fill: #1e3a5f;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'SF Mono','Fira Code','JetBrains Mono','Cascadia Code',monospace;
  font-size: 11px;
  overflow: hidden;
  height: 100vh;
  line-height: 1.4;
}

/* ═══ Layout ═══ */
.app {
  display: grid;
  grid-template-rows: 44px 1fr 180px;
  height: 100vh;
}

/* ═══ Top Bar ═══ */
.topbar {
  display: flex;
  align-items: center;
  padding: 0 12px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  gap: 14px;
  z-index: 10;
}
.topbar h1 {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, var(--accent), var(--flow));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.sep { width:1px; height:20px; background:var(--border); }
.meta-info { color: var(--text-dim); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-select {
  background: var(--fader-track);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 3px 8px;
  border-radius: 3px;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  min-width: 140px;
}
.session-select:focus { outline: none; border-color: var(--accent); }
.transport {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  background: var(--fader-track);
  border-radius: 4px;
  border: 1px solid var(--border);
  margin-left: auto;
}
.transport-btn {
  width: 28px; height: 24px;
  border: 1px solid var(--border);
  background: var(--panel-hi);
  color: var(--text);
  border-radius: 2px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.12s;
}
.transport-btn:hover { background: var(--accent); border-color: var(--accent); }
.transport-btn:active { transform: scale(0.95); }
.transport-btn.active { background: var(--flow); border-color: var(--flow); color: #000; }
.transport .pos { color: var(--text); font-size: 12px; font-weight: 600; min-width: 50px; text-align: center; }
.transport .bpm { color: var(--accent); font-weight: 700; font-size: 14px; min-width: 30px; text-align: center; }
.transport .label { color: var(--text-dim); font-size: 9px; }
.btn {
  background: var(--panel-hi);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 5px 10px;
  border-radius: 3px;
  cursor: pointer;
  font-family: inherit;
  font-size: 10px;
  transition: all 0.12s;
  white-space: nowrap;
}
.btn:hover { background: var(--accent); border-color: var(--accent); }

/* ═══ Main Area ═══ */
.main {
  display: grid;
  grid-template-columns: 170px 1fr 280px;
  overflow: hidden;
  position: relative;
}

/* ═══ Channel Strips ═══ */
.channels-panel {
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.channels-header {
  padding: 8px 10px;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}
.channels-list {
  flex: 1;
  overflow-y: auto;
}
.channel-strip {
  display: grid;
  grid-template-columns: 24px 1fr 28px 28px;
  grid-template-rows: auto auto auto;
  padding: 6px 8px;
  gap: 2px 6px;
  border-bottom: 1px solid rgba(30,45,61,0.5);
  cursor: pointer;
  transition: background 0.12s;
  align-items: center;
}
.channel-strip:hover { background: var(--panel-hi); }
.channel-strip.muted { opacity: 0.35; }
.channel-strip.soloed { background: rgba(59,130,246,0.1); }
.ch-color {
  width: 6px; border-radius: 2px;
  grid-row: 1 / -1;
  align-self: stretch;
}
.ch-name {
  font-weight: 600; font-size: 11px;
  grid-column: 2; grid-row: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.ch-stats {
  color: var(--text-dim); font-size: 9px;
  grid-column: 2; grid-row: 2;
}
.ch-fader-wrap {
  grid-column: 2; grid-row: 3;
  height: 3px;
  background: var(--fader-track);
  border-radius: 1px;
  cursor: pointer;
  position: relative;
}
.ch-fader-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 1px;
  transition: width 0.08s;
  opacity: 0.6;
}
.ch-btn {
  width: 22px; height: 16px;
  border: 1px solid var(--border);
  background: var(--fader-track);
  color: var(--text-dim);
  border-radius: 2px;
  cursor: pointer;
  font-size: 8px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.1s;
}
.ch-btn:hover { border-color: var(--text-dim); }
.ch-btn.M { grid-column: 3; grid-row: 1; }
.ch-btn.S { grid-column: 4; grid-row: 1; }
.ch-btn.M.active { background: var(--mute); color: #000; border-color: var(--mute); }
.ch-btn.S.active { background: var(--solo); color: #fff; border-color: var(--solo); }
.ch-meter {
  grid-column: 3 / 5; grid-row: 2;
  height: 2px; background: var(--fader-track); border-radius: 1px;
}
.ch-meter-fill {
  height: 100%; border-radius: 1px;
  transition: width 0.15s;
}

/* ═══ Center: DAW Grid ═══ */
.daw-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

/* Timeline */
.timeline-strip {
  height: 32px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 8px;
}
.timeline-label {
  color: var(--text-dim);
  font-size: 9px;
  letter-spacing: 1px;
  margin-right: 10px;
  flex-shrink: 0;
}
.timeline {
  flex: 1;
  height: 18px;
  background: var(--fader-track);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.timeline-bar {
  display: flex;
  height: 100%;
  align-items: flex-end;
  gap: 1px;
}
.timeline-tick {
  flex: 1;
  background: var(--accent);
  opacity: 0.25;
  border-radius: 1px 1px 0 0;
  min-width: 2px;
}
.timeline-tick.hot { opacity: 0.75; background: var(--dmn); }
.timeline-tick.peak { opacity: 0.95; background: var(--tension-hi); }
.timeline-playhead {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--flow);
  pointer-events: none;
  z-index: 5;
}

/* DAW Piano Roll */
.daw-roll {
  flex: 1;
  overflow: auto;
  position: relative;
}
.daw-tracks {
  position: relative;
  min-width: 100%;
}
.daw-row {
  height: 50px;
  border-bottom: 1px solid rgba(30,45,61,0.25);
  position: relative;
}
.daw-row:nth-child(even) { background: rgba(17,24,39,0.5); }
.daw-row-label {
  position: sticky;
  left: 0;
  width: 80px;
  height: 100%;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 8px;
  font-size: 10px;
  font-weight: 600;
  z-index: 4;
  color: var(--text-dim);
}
.note-block {
  position: absolute;
  border-radius: 3px;
  cursor: pointer;
  transition: filter 0.1s, transform 0.1s;
  border: 1px solid rgba(255,255,255,0.15);
  display: flex;
  align-items: center;
  padding: 0 4px;
  font-size: 8px;
  color: rgba(0,0,0,0.7);
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.note-block:hover {
  filter: brightness(1.3) saturate(1.2);
  z-index: 10;
  box-shadow: 0 0 8px rgba(255,255,255,0.2);
}
.note-block.selected {
  box-shadow: 0 0 0 2px #fff, 0 0 16px var(--accent);
  z-index: 20;
  animation: note-pulse 1.2s ease-in-out infinite;
}
@keyframes note-pulse {
  0%, 100% { box-shadow: 0 0 0 2px #fff, 0 0 16px var(--accent); }
  50% { box-shadow: 0 0 0 2px #fff, 0 0 28px var(--accent), 0 0 40px rgba(59,130,246,0.3); }
}
.note-tooltip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--panel-hi);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 10px;
  color: var(--text);
  max-width: 320px;
  white-space: normal;
  word-wrap: break-word;
  z-index: 99;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  line-height: 1.5;
}
.note-tooltip::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--panel-hi);
}
.note-block:hover .note-tooltip { opacity: 1; }
.note-tooltip .tt-agent {
  color: var(--accent);
  font-weight: 700;
  margin-bottom: 2px;
}
.note-tooltip .tt-text {
  color: var(--text-dim);
}
.daw-playhead {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--flow);
  pointer-events: none;
  z-index: 6;
  box-shadow: 0 0 8px var(--flow);
}

/* ═══ Right: Detail Panel ═══ */
.detail-panel {
  background: var(--panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.detail-header {
  padding: 8px 10px;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
}
.detail-body {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  scroll-behavior: smooth;
}
.detail-flash {
  animation: detail-highlight 0.4s ease-out;
}
@keyframes detail-highlight {
  0% { background: rgba(59,130,246,0.12); }
  100% { background: transparent; }
}
.detail-empty {
  color: var(--text-dim);
  text-align: center;
  padding: 40px 20px;
  font-style: italic;
  line-height: 1.8;
}
.detail-agent {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 2px;
}
.detail-meta {
  font-size: 10px;
  color: var(--text-dim);
  margin-bottom: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.detail-meta span {
  background: var(--fader-track);
  padding: 1px 6px;
  border-radius: 2px;
}
.detail-text {
  font-size: 12px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-wrap: break-word;
}
.detail-musical {
  margin-top: 14px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px 8px;
  font-size: 10px;
  color: var(--text-dim);
}
.detail-musical .val { color: var(--text); font-weight: 600; }
.detail-pitch {
  margin-top: 12px;
  padding: 8px;
  background: var(--fader-track);
  border-radius: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.piano-key {
  width: 18px; height: 40px;
  background: #fff;
  border: 1px solid #333;
  border-radius: 0 0 3px 3px;
  position: relative;
  color: #000;
  font-size: 8px;
  font-weight: 700;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 3px;
}
.piano-key.black {
  width: 14px; height: 26px;
  background: #1a1a2e;
  border-color: #555;
  position: absolute;
  top: 0;
  right: -7px;
  z-index: 1;
  color: #aaa;
  font-size: 7px;
}

/* ═══ Pulse Grid (bottom) ═══ */
.pulse-panel {
  background: var(--panel);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.pulse-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.pulse-header h3 {
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--text-dim);
}
.pulse-legend {
  display: flex;
  gap: 14px;
  font-size: 9px;
  color: var(--text-dim);
}
.pulse-legend span { display: flex; align-items: center; gap: 4px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.pulse-cycle {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 3px;
  height: 64px;
}
.pulse-cell {
  border-radius: 3px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  transition: all 0.15s;
  border: 2px solid transparent;
  cursor: default;
}
.pulse-cell .pulse-num {
  font-size: 13px;
  font-weight: 700;
}
.pulse-cell .pulse-label {
  font-size: 7px;
  opacity: 0.7;
  margin-top: 1px;
}
.pulse-cell.ecn { border-color: var(--ecn); background: rgba(139,92,246,0.08); }
.pulse-cell.dmn { border-color: var(--dmn); background: rgba(236,72,153,0.08); }
.pulse-cell.flow { border-color: var(--flow); background: rgba(6,182,212,0.12); }
.pulse-cell.ecn.dmn { border-color: var(--flow); background: rgba(6,182,212,0.18); }
@keyframes pulse-breathe {
  0%, 100% { box-shadow: 0 0 8px var(--accent), 0 0 0 0 rgba(59,130,246,0.4); }
  50% { box-shadow: 0 0 22px var(--accent), 0 0 0 6px rgba(59,130,246,0); }
}
@keyframes pulse-breathe-ecn {
  0%, 100% { box-shadow: 0 0 8px var(--ecn), 0 0 0 0 rgba(139,92,246,0.4); }
  50% { box-shadow: 0 0 22px var(--ecn), 0 0 0 6px rgba(139,92,246,0); }
}
@keyframes pulse-breathe-dmn {
  0%, 100% { box-shadow: 0 0 8px var(--dmn), 0 0 0 0 rgba(236,72,153,0.4); }
  50% { box-shadow: 0 0 22px var(--dmn), 0 0 0 6px rgba(236,72,153,0); }
}
@keyframes pulse-breathe-flow {
  0%, 100% { box-shadow: 0 0 12px var(--flow), 0 0 0 0 rgba(6,182,212,0.5); }
  50% { box-shadow: 0 0 32px var(--flow), 0 0 0 8px rgba(6,182,212,0); }
}
@keyframes pulse-ring {
  0% { opacity: 1; transform: translate(-50%,-50%) scale(0.6); }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.6); }
}
@keyframes trail-fade {
  0% { opacity: 0.6; filter: brightness(1.4); }
  100% { opacity: 0; filter: brightness(1); }
}
.pulse-cell.active {
  transform: scale(1.06);
  z-index: 2;
  animation: pulse-breathe 0.8s ease-in-out infinite;
}
.pulse-cell.active::after {
  content: '';
  position: absolute;
  inset: -4px;
  border-radius: 6px;
  border: 2px solid currentColor;
  animation: pulse-ring 0.8s ease-out infinite;
  pointer-events: none;
}
.pulse-cell.ecn.active { background: var(--ecn) !important; color: #fff; animation-name: pulse-breathe-ecn; }
.pulse-cell.dmn.active { background: var(--dmn) !important; color: #fff; animation-name: pulse-breathe-dmn; }
.pulse-cell.flow.active { background: var(--flow) !important; color: #000; animation-name: pulse-breathe-flow; }
.pulse-cell.ecn.dmn.active { background: var(--flow) !important; color: #000; animation-name: pulse-breathe-flow; }
.pulse-cell.trail { animation: trail-fade 0.5s ease-out forwards; }
.pulse-cell.silent { opacity: 0.25; }

.tension-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.tension-label {
  color: var(--text-dim);
  font-size: 8px;
  letter-spacing: 1px;
}
.tension-bar {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 3px;
  height: 14px;
}
.tension-cell {
  border-radius: 2px;
  transition: background 0.2s;
}

.tension-curve-wrap {
  flex: 1;
  display: flex;
  align-items: center;
}
.tension-curve-bg {
  flex: 1;
  height: 14px;
  background: var(--fader-track);
  border-radius: 2px;
  position: relative;
  overflow: hidden;
}
.tension-curve-line {
  position: absolute;
  top: 0; left: 0;
  height: 100%;
  width: 100%;
}

/* ═══ Scrollbar ═══ */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--panel-hi); }

/* Drop zone overlay */
.drop-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,13,20,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  border: 3px dashed var(--accent);
}
.drop-overlay.show { display: flex; }
.drop-overlay .drop-msg {
  font-size: 16px;
  color: var(--accent);
  text-align: center;
}
</style>
</head>
<body>

<div class="app">
  <!-- ═══ Top Bar ═══ -->
  <div class="topbar">
    <h1>♫ TENSOR-MIDI MIXER</h1>
    <div class="sep"></div>
    <select class="session-select" id="session-select">
      <option value="sample">— Load a Session —</option>
    </select>
    <span class="meta-info" id="meta-info"></span>
    <div class="transport">
      <button class="transport-btn" id="btn-stop" title="Stop">■</button>
      <button class="transport-btn" id="btn-play" title="Play/Pause">▶</button>
      <span class="pos" id="position">1.1.0</span>
      <span class="bpm" id="bpm-display">120</span>
      <span class="label">BPM</span>
    </div>
    <button class="btn" id="btn-open-file">Open File</button>
    <input type="file" id="file-input" accept=".json,.tensor.json" style="display:none">
  </div>

  <!-- ═══ Main Area ═══ -->
  <div class="main">
    <!-- Channel Strips -->
    <div class="channels-panel">
      <div class="channels-header">
        <span>CHANNELS</span>
        <span id="ch-count">0</span>
      </div>
      <div class="channels-list" id="channels-list"></div>
    </div>

    <!-- DAW Area -->
    <div class="daw-area">
      <div class="timeline-strip">
        <span class="timeline-label">DENSITY</span>
        <div class="timeline" id="timeline">
          <div class="timeline-bar" id="timeline-bar"></div>
          <div class="timeline-playhead" id="timeline-playhead" style="left:0%"></div>
        </div>
      </div>
      <div class="daw-roll" id="daw-roll">
        <div class="daw-tracks" id="daw-tracks"></div>
        <div class="daw-playhead" id="daw-playhead" style="left:0%"></div>
      </div>
    </div>

    <!-- Detail Panel -->
    <div class="detail-panel">
      <div class="detail-header">NOTE DETAIL</div>
      <div class="detail-body" id="detail-body">
        <div class="detail-empty" id="detail-empty">
          Click any note<br>to see the full<br>message text
        </div>
      </div>
    </div>
  </div>

  <!-- ═══ Pulse Grid ═══ -->
  <div class="pulse-panel">
    <div class="pulse-header">
      <h3>12-PULSE GRID — 3:4 POLYRHYTHM</h3>
      <div class="pulse-legend">
        <span><div class="legend-dot" style="background:var(--ecn)"></div>ECN</span>
        <span><div class="legend-dot" style="background:var(--dmn)"></div>DMN</span>
        <span><div class="legend-dot" style="background:var(--flow)"></div>FLOW</span>
      </div>
    </div>
    <div class="pulse-cycle" id="pulse-cycle"></div>
    <div class="tension-row">
      <span class="tension-label">TENSION</span>
      <div class="tension-bar" id="tension-bar"></div>
    </div>
  </div>
</div>

<!-- Drop overlay -->
<div class="drop-overlay" id="drop-overlay">
  <div class="drop-msg">Drop .tensor.json file here</div>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// TENSOR-MIDI MIXER ENGINE
// ════════════════════════════════════════════════════════════════════

const PPQ = 96;

// ─── Transform sample sessions to match the tensor format used by renderers ───
function sessionToTensor(session) {
  const tracks = [];
  const trackMap = {};
  for (const note of session.notes) {
    if (!trackMap[note.agent]) {
      const agentDef = session.agents.find(a => a.name === note.agent) || {};
      trackMap[note.agent] = tracks.length;
      tracks.push({ track: note.agent, channel: note.channel, notes: [], instrument: agentDef.instrument || '', color: agentDef.color || note.color });
    }
    tracks[trackMap[note.agent]].notes.push(note);
  }
  return {
    title: session.title,
    roomId: session.roomId,
    tempo: session.tempo,
    key: session.key,
    timeSignature: session.timeSignature,
    duration: session.duration,
    noteCount: session.notes.length,
    trackCount: tracks.length,
    tracks,
    agents: session.agents,
    analysis: session.analysis,
    metadata: session.metadata,
  };
}

// ─── Initialize Pulse Grid ───
function initPulseGrid() {
  const cycle = document.getElementById('pulse-cycle');
  const tBar = document.getElementById('tension-bar');
  cycle.innerHTML = '';
  tBar.innerHTML = '';

  for (let i = 0; i < 12; i++) {
    const cell = document.createElement('div');
    const isECN = ECN_PULSES.includes(i);
    const isDMN = DMN_PULSES.includes(i);
    const isFlow = i === 0;

    let cls = ['pulse-cell'];
    if (isFlow) cls.push('flow','ecn','dmn');
    else if (isECN && isDMN) cls.push('ecn','dmn');
    else if (isECN) cls.push('ecn');
    else if (isDMN) cls.push('dmn');
    else cls.push('silent');

    cell.className = cls.join(' ');
    cell.innerHTML = `<div class="pulse-num">${i+1}</div><div class="pulse-label">${isFlow?'FLOW':isECN&&isDMN?'BOTH':isECN?'ECN':isDMN?'DMN':'&mdash;'}</div>`;
    cycle.appendChild(cell);

    const tCell = document.createElement('div');
    tCell.className = 'tension-cell';
    tCell.style.background = 'rgba(92,107,130,0.08)';
    tCell.setAttribute('data-pulse', i);
    tBar.appendChild(tCell);
  }
}

function pulseMoment(pulse) {
  if (pulse === state.pulse) return;
  document.querySelectorAll('.pulse-cell').forEach((c,i) => {
    if (i === state.pulse) { c.classList.remove('active','trail'); void c.offsetWidth; c.classList.add('trail'); }
    if (i === pulse) { c.classList.remove('trail'); void c.offsetWidth; c.classList.add('active'); }
  });
  state.pulse = pulse;
}

// ─── Update tension bar from analysis data ───
function updateTensionBar() {
  const data = state.tensorData;
  if (!data || !data.analysis) return;
  const tCells = document.querySelectorAll('.tension-cell');
  if (tCells.length !== 12) return;

  const curve = data.analysis.tensionCurve || [];
  const avg = curve.length > 0 ? curve.reduce((a,b)=>a+b,0)/curve.length : 0.3;

  for (let i = 0; i < 12; i++) {
    const idx = Math.floor((i / 12) * curve.length);
    const val = curve[Math.min(idx, curve.length-1)] || avg;
    const h = val;
    const r = Math.round(100 + h * 155);
    const g = Math.round(200 - h * 180);
    const b = Math.round(80 - h * 70);
    tCells[i].style.background = `rgba(${r},${g},${b},${0.3 + h * 0.7})`;
    tCells[i].title = `Pulse ${i+1}: tension ${(val*100).toFixed(0)}%`;
  }
}

// ─── Load session ───
function loadSession(session) {
  state.tensorData = sessionToTensor(session);
  state.channels = {};
  state.selectedNote = null;
  state.playhead = 0;

  for (const t of state.tensorData.tracks) {
    state.channels[t.track] = { muted: false, solo: false, volume: 1.0, channel: t.channel };
  }

  renderAll();
  updateMeta();
  updateTensionBar();
}

function updateMeta() {
  const d = state.tensorData;
  if (!d) {
    document.getElementById('meta-info').textContent = '';
    return;
  }
  const form = d.analysis?.form || '—';
  document.getElementById('meta-info').textContent =
    `${d.title} · ${d.key} · ${d.timeSignature} · ${form} · ${d.noteCount} notes · ${d.duration}s`;
  document.getElementById('bpm-display').textContent = d.tempo;
}

function renderAll() {
  renderChannels();
  renderDAW();
  renderTimeline();
}

// ─── Render Channel Strips ───
function renderChannels() {
  const container = document.getElementById('channels-list');
  const countEl = document.getElementById('ch-count');
  const data = state.tensorData;
  container.innerHTML = '';
  if (!data) { countEl.textContent = '0'; return; }

  countEl.textContent = data.tracks.length;

  for (const track of data.tracks) {
    const ch = state.channels[track.track];
    if (!ch) continue;

    const noteCount = track.notes.length;
    const avgVel = Math.round(track.notes.reduce((s,n)=>s+n.velocity,0) / Math.max(1,noteCount));
    const agentDef = data.agents?.find(a => a.name === track.track);
    const color = track.notes[0]?.color || agentDef?.color || '#64748b';

    const div = document.createElement('div');
    div.className = 'channel-strip';
    if (ch.muted) div.classList.add('muted');
    if (ch.solo) div.classList.add('soloed');

    div.innerHTML = `
      <div class="ch-color" style="background:${color}"></div>
      <div class="ch-name">${track.track}</div>
      <div class="ch-stats">${noteCount}n · vel${avgVel}</div>
      <div class="ch-fader-wrap" data-agent="${track.track}">
        <div class="ch-fader-fill" style="width:${ch.volume*100}%"></div>
      </div>
      <div class="ch-btn M ${ch.muted?'active':''}" data-agent="${track.track}" data-action="mute">M</div>
      <div class="ch-btn S ${ch.solo?'active':''}" data-agent="${track.track}" data-action="solo">S</div>
      <div class="ch-meter"><div class="ch-meter-fill" style="width:${avgVel/127*100}%;background:${color}"></div></div>
    `;

    div.querySelectorAll('.ch-btn').forEach(btn => {
      btn.onclick = (e) => { e.stopPropagation(); toggleChannel(btn.dataset.agent, btn.dataset.action); };
    });
    const fader = div.querySelector('.ch-fader-wrap');
    fader.onclick = (e) => {
      const rect = fader.getBoundingClientRect();
      ch.volume = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      renderChannels();
      renderDAW();
    };
    div.onclick = () => selectTrack(track.track);

    container.appendChild(div);
  }
}

function toggleChannel(agent, action) {
  const ch = state.channels[agent];
  if (!ch) return;
  if (action === 'mute') ch.muted = !ch.muted;
  else ch.solo = !ch.solo;
  renderChannels();
  renderDAW();
}

function selectTrack(agent) {
  const ch = state.channels[agent];
  if (!ch) return;
  ch.solo = !ch.solo;
  renderChannels();
  renderDAW();
}

// ─── Render DAW Grid ───
function renderDAW() {
  const container = document.getElementById('daw-tracks');
  const data = state.tensorData;
  container.innerHTML = '';
  if (!data) return;

  const pxPerSec = 22;
  container.style.width = `${data.duration * pxPerSec + 200}px`;

  const anySolo = Object.values(state.channels).some(c => c.solo);

  for (const track of data.tracks) {
    const ch = state.channels[track.track];
    if (!ch) continue;

    const visible = anySolo ? ch.solo : !ch.muted;
    const opacity = ch.volume;

    const row = document.createElement('div');
    row.className = 'daw-row';
    const label = document.createElement('div');
    label.className = 'daw-row-label';
    label.textContent = track.track;
    row.appendChild(label);

    if (visible) {
      for (const note of track.notes) {
        const el = document.createElement('div');
        el.className = 'note-block';
        const left = note.start * pxPerSec + 82;
        const width = Math.max(4, note.duration * pxPerSec);
        const top = 6 + Math.random() * 28;
        const height = Math.max(8, Math.min(22, 10 + (note.velocity / 127) * 16));

        el.style.left = left + 'px';
        el.style.width = width + 'px';
        el.style.top = top + 'px';
        el.style.height = height + 'px';
        el.style.background = note.color;
        el.style.opacity = 0.45 + (note.velocity / 127) * 0.55 * opacity;
        el.style.borderColor = note.color;

        if (width > 35) el.textContent = note.text.substring(0, Math.floor(width / 5)) + '…';

        const tooltip = document.createElement('div');
        tooltip.className = 'note-tooltip';
        tooltip.innerHTML = `<div class="tt-agent">${note.agent}</div><div class="tt-text">${note.text.length > 140 ? note.text.substring(0, 140) + '…' : note.text}</div>`;
        el.appendChild(tooltip);

        el.dataset.agent = note.agent;
        el.dataset.start = note.start;

        if (state.selectedNote && state.selectedNote.agent === note.agent && state.selectedNote.start === note.start) {
          el.classList.add('selected');
        }

        el.onclick = (e) => {
          e.stopPropagation();
          selectNote(note, el);
        };
        el.onmouseenter = () => { el.style.zIndex = '8'; };
        el.onmouseleave = () => { el.style.zIndex = ''; };

        row.appendChild(el);
      }
    }

    container.appendChild(row);
  }

  document.getElementById('daw-playhead').style.left = (state.playhead * 100) + '%';
}

// ─── Select Note + Update Detail Panel ───
function selectNote(note, el) {
  document.querySelectorAll('.note-block.selected').forEach(n => n.classList.remove('selected'));
  if (el) el.classList.add('selected');
  state.selectedNote = { agent: note.agent, start: note.start, note };

  const body = document.getElementById('detail-body');
  const empty = document.getElementById('detail-empty');
  if (empty) empty.style.display = 'none';

  body.classList.remove('detail-flash');
  void body.offsetWidth;
  body.classList.add('detail-flash');
  body.scrollTop = 0;

  const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const pitchName = noteNames[note.pitch % 12] + Math.floor(note.pitch / 12 - 1);

  body.innerHTML = `
    <div class="detail-agent">${note.agent}</div>
    <div class="detail-meta">
      <span>${note.sentiment || '—'}</span>
      <span>${pitchName}</span>
      <span>vel ${note.velocity}</span>
      <span>${note.duration.toFixed(1)}s</span>
      <span>@ ${note.start.toFixed(1)}s</span>
    </div>
    <div class="detail-text">${note.text}</div>
    <div class="detail-pitch">
      <div style="position:relative">
        <div class="piano-key">${noteNames[note.pitch % 12]}</div>
      </div>
      <div style="font-size:11px;color:var(--text-dim)">
        Note ${note.pitch}<br>
        <span style="color:var(--text)">${pitchName}</span>
      </div>
    </div>
    <div class="detail-musical">
      <div>Channel</div><div class="val">${note.channel}</div>
      <div>Velocity</div><div class="val">${note.velocity}/127</div>
      <div>Duration</div><div class="val">${note.duration.toFixed(2)}s</div>
      <div>Onset</div><div class="val">${note.start.toFixed(2)}s</div>
    </div>
  `;
}

const dawRoll = document.getElementById('daw-roll');
const dawTracks = document.getElementById('daw-tracks');
dawRoll.onclick = (e) => {
  if (e.target === dawRoll || e.target === dawTracks) {
    document.querySelectorAll('.note-block.selected').forEach(n => n.classList.remove('selected'));
    state.selectedNote = null;
    const body = document.getElementById('detail-body');
    body.classList.remove('detail-flash');
    body.innerHTML = '<div class="detail-empty">Click any note<br>to see the full<br>message text</div>';
  }
};

// ─── Render Timeline ───
function renderTimeline() {
  const bar = document.getElementById('timeline-bar');
  bar.innerHTML = '';
  const data = state.tensorData;
  if (!data) return;

  const buckets = 80;
  const duration = data.duration || 60;
  const counts = new Array(buckets).fill(0);

  for (const track of data.tracks) {
    for (const note of track.notes) {
      const b = Math.floor((note.start / duration) * buckets);
      if (b >= 0 && b < buckets) counts[b]++;
    }
  }

  const maxC = Math.max(1, ...counts);
  for (let i = 0; i < buckets; i++) {
    const tick = document.createElement('div');
    tick.className = 'timeline-tick';
    const ratio = counts[i] / maxC;
    tick.style.height = (ratio * 100) + '%';
    if (ratio > 0.8) tick.classList.add('peak');
    else if (ratio > 0.5) tick.classList.add('hot');
    bar.appendChild(tick);
  }
}

// ─── Playback Animation ───
function startAnimation() {
  if (state.animFrame) return;
  state.lastTick = performance.now();

  function loop(now) {
    const delta = (now - state.lastTick) / 1000;
    state.lastTick = now;

    if (state.playing && state.tensorData) {
      const dur = state.tensorData.duration || 60;
      state.playhead += delta / dur;
      if (state.playhead >= 1) state.playhead = 0;

      const phPct = state.playhead * 100;
      const dawPh = document.getElementById('daw-playhead');
      const tlPh = document.getElementById('timeline-playhead');
      if (dawPh) dawPh.style.left = phPct + '%';
      if (tlPh) tlPh.style.left = phPct + '%';

      const bar = Math.floor(state.playhead * (dur / (60 / state.tensorData.tempo))) + 1;
      const beat = Math.floor((state.playhead * dur * state.tensorData.tempo / 60) % 4) + 1;
      const pulse = Math.floor((state.playhead * dur * state.tensorData.tempo / 60 * 12 / 4) % 12);
      document.getElementById('position').textContent = `${bar}.${beat}.${pulse}`;
      pulseMoment(pulse);
    }

    state.animFrame = requestAnimationFrame(loop);
  }

  state.animFrame = requestAnimationFrame(loop);
}

// ─── Transport Controls ───
document.getElementById('btn-play').onclick = () => {
  state.playing = !state.playing;
  document.getElementById('btn-play').classList.toggle('active', state.playing);
  document.getElementById('btn-play').textContent = state.playing ? '⏸' : '▶';
};
document.getElementById('btn-stop').onclick = () => {
  state.playing = false;
  state.playhead = 0;
  document.getElementById('btn-play').classList.remove('active');
  document.getElementById('btn-play').textContent = '▶';
  document.getElementById('daw-playhead').style.left = '0%';
  document.getElementById('timeline-playhead').style.left = '0%';
  document.getElementById('position').textContent = '1.1.0';
  pulseMoment(0);
};
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); document.getElementById('btn-play').click(); }
});

// ─── Session Select ───
const sessionSelect = document.getElementById('session-select');
SAMPLE_SESSIONS.forEach((s, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = s.title;
  sessionSelect.appendChild(opt);
});
sessionSelect.onchange = () => {
  const idx = parseInt(sessionSelect.value);
  if (idx >= 0 && idx < SAMPLE_SESSIONS.length) loadSession(SAMPLE_SESSIONS[idx]);
};

// ─── File Loading ───
document.getElementById('btn-open-file').onclick = () => document.getElementById('file-input').click();
document.getElementById('file-input').onchange = (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const session = data.tracks ? data : { ...data, notes: data.tracks?.flatMap(t => t.notes.map(n => ({ ...n, agent: t.track }))) };
      if (!session.notes) {
        alert('Invalid tensor JSON — expected "notes" array or "tracks" array');
        return;
      }
      const wrapped = {
        id: data.id || 'imported',
        title: data.title || 'Imported Session',
        roomId: data.roomId || '—',
        tempo: data.tempo || 120,
        key: data.key || '?',
        timeSignature: data.timeSignature || '12/8',
        duration: data.duration || 60,
        noteCount: session.notes?.length || 0,
        notes: session.notes,
        agents: data.agents || [...new Set((session.notes || []).map(n => n.agent))].map((name, i) => ({ name, channel: i, color: '#64748b' })),
        analysis: data.analysis || {},
        metadata: data.metadata || {},
      };
      loadSession(wrapped);
    } catch (err) { alert('Failed to parse file: ' + err.message); }
  };
  reader.readAsText(file);
};

// ─── Drag & Drop ───
const overlay = document.getElementById('drop-overlay');
['dragover','dragenter'].forEach(ev => {
  document.addEventListener(ev, (e) => { e.preventDefault(); overlay.classList.add('show'); });
});
['dragleave','drop'].forEach(ev => {
  document.addEventListener(ev, (e) => {
    e.preventDefault();
    overlay.classList.remove('show');
  });
});
document.addEventListener('drop', (e) => {
  e.preventDefault();
  const file = e.dataTransfer?.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      const session = {
        id: data.id || file.name,
        title: data.title || file.name,
        roomId: data.roomId || '—',
        tempo: data.tempo || 120,
        key: data.key || '?',
        timeSignature: data.timeSignature || '12/8',
        duration: data.duration || 60,
        noteCount: (data.tracks ? data.tracks.reduce((s,t) => s + t.notes.length, 0) : data.notes?.length || 0),
        notes: data.notes || data.tracks?.flatMap(t => t.notes.map(n => ({ ...n, agent: t.track }))) || [],
        agents: data.agents || [],
        analysis: data.analysis || {},
        metadata: data.metadata || {},
      };
      loadSession(session);
    } catch (err) { alert('Invalid JSON: ' + err.message); }
  };
  reader.readAsText(file);
});

// ─── Initialize ───
initPulseGrid();
startAnimation();

// Auto-load first session
setTimeout(() => {
  if (!state.tensorData) loadSession(SAMPLE_SESSIONS[0]);
}, 100);
</script>
