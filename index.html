<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TENSOR-MIDI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header id="topbar">
<div class="logo">🎹 TENSOR-MIDI</div>
<div id="transport">
<button id="btn-play" class="tb" title="Play/Pause">▶</button>
<button id="btn-stop" class="tb" title="Stop">⏹</button>
<button id="btn-rec" class="tb rec" title="Record">●</button>
<div class="pos"><span id="v-bar">1</span>.<span id="v-beat">1</span>.<span id="v-pulse">01</span></div>
<div class="bpm"><span id="v-bpm">120</span> <small>BPM</small></div>
</div>
<div class="taps"><div class="tdot" id="tap-dot"></div><span>Tap</span></div>
<div class="dev" id="dev-info">···</div>
</header>
<div id="jazzbar">
<div class="jm" id="j-mode">🎵 GROOVE</div>
<div class="jc" id="j-chord">Maj7</div>
<div class="jd" id="j-desc">Connecting to The Tap...</div>
<div class="jms">
<span class="ml">Tension</span><div class="mbar"><div class="mfill" id="mf-t"></div></div>
<span class="ml">Energy</span><div class="mbar"><div class="mfill e" id="mf-e"></div></div>
<span class="ml">Complex</span><div class="mbar"><div class="mfill c" id="mf-c"></div></div>
</div>
</div>
<main id="main">
<section class="pn"><div class="ph"><h2>MIXER</h2><span class="pi" id="ch-count">0 ch</span></div><div class="pb"><div id="chstrip"></div></div></section>
<section class="pn"><div class="ph"><h2>12-PULSE GRID</h2><span class="pi">ECN x DMN</span></div><div class="pb"><div id="pgrid"></div></div></section>
<section class="pn" id="chart-panel"><div class="ph"><h2>CHART</h2><span class="pi" id="chart-info">-</span></div><div class="pb" style="position:relative"><canvas id="chartcv"></canvas><div class="cov" id="chart-ov">-</div><div class="cctrls"><button class="ccb" id="cz-in">+</button><button class="ccb" id="cz-out">-</button><button class="ccb" id="cz-ctr">*</button></div></div></section>
</main>
<section id="evlog"><div class="ph"><h2>CONVERSATION</h2><span class="pi" id="ev-count">0</span></div><div id="evlist"></div></section>
<footer id="footer"><div class="fl"><span id="sess">No session</span><button class="fb" id="b-ns">New</button><button class="fb" id="b-ex">Export JSON</button><button class="fb" id="b-aud">Audio</button><button class="fb" id="b-tap">Post</button></div><div>Tensor-MIDI v1.0</div></footer>
</div>
<script src="app.js"></script>
</body>
</html>
